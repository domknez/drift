[package]
name = "drift"
version = "0.1.0"
edition = "2024"
description = "Free and open source, ultra-lightweight desktop client for Microsoft Teams chats and channels"
license = "MIT"
repository = "https://github.com/domknez/drift"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "links", "wayland", "x11"] }
fastrand = "2"
keyring-core = "1"
# Profile pictures arrive as JPEG, team pictures as PNG.
png = "0.18"
zune-jpeg = "0.5"
# GIFs people pick (their first frame).
gif = "0.14"
serde_json = "1"
ureq = { version = "3", features = ["json"] }
# Trouter, the websocket Teams pushes changes through; some of its bodies come gzipped.
tungstenite = { version = "0.28", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
flate2 = "1"
# Checking a downloaded update against its release's checksums.
sha2 = "0.11"
# The clipboard's HTML, for links in pasted text (egui only hands over its plain text).
arboard = { version = "3.7", default-features = false }
# The system's file dialog, for attaching pictures.
rfd = "0.15"
# The Microsoft sign-in page, shown in a helper process (see login.rs).
tao = "0.37"
wry = "0.57"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }
# The unread count on the Dock icon.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError", "NSObject"] }
# Notifications from the app bundle, through the system's notification center.
block2 = "0.6"
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

[target.'cfg(unix)'.dependencies]
# The local time zone for message times.
libc = "0.2"
# Unpacking an update's .tar.gz (Linux) without the system's tar, which may not be GNU's.
tar = { version = "0.4", default-features = false }

[target.'cfg(windows)'.dependencies]
notify-rust = "4"
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# The system's notifications for new messages (macOS uses its notification center).
notify-rust = "4"
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
