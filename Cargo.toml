[package]
name = "drift"
version = "0.1.0"
edition = "2024"
description = "Free and open source, ultra-lightweight desktop client for Microsoft Teams chats and channels"
license = "MIT"
repository = "https://github.com/domknez/drift"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "clipboard", "links", "wayland", "x11"] }
keyring-core = "1"
serde_json = "1"
ureq = { version = "3", features = ["json"] }
# The Microsoft sign-in page, shown in a helper process (see login.rs).
tao = "0.37"
wry = "0.57"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(unix)'.dependencies]
# The local time zone for message times.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "1", default-features = false }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
