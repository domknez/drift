# Build drift for macOS, Linux and Windows and publish them as a GitHub release.
#
# Runs for a version tag pushed by hand (v1.2.0), and from tag.yml for the tag it
# makes when it is run by hand.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_call:
    inputs:
      tag:
        description: The tag to release, like v1.2.3
        required: true
        type: string

# Building needs only to read; publishing the release writes (its job says so).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: macos, os: macos-latest }
          # The oldest runner there is: the binary needs the glibc it's built against or newer.
          - { name: linux-x86_64, os: ubuntu-22.04 }
          - { name: windows-x86_64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: ./.github/linux-deps.sh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: release
      - name: Version from the tag
        run: |
          ./scripts/set-version.sh "$TAG"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Build (macOS, for Apple silicon, Intel and both in one app)
        if: runner.os == 'macOS'
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/drift \
            target/aarch64-apple-darwin/release/drift target/x86_64-apple-darwin/release/drift
          mkdir -p out
          # One app for both, and a smaller one for each.
          for build in universal:target/universal aarch64:target/aarch64-apple-darwin/release x86_64:target/x86_64-apple-darwin/release; do
            name=${build%%:*}
            [ "$name" = aarch64 ] && name=arm64
            DRIFT_BINARY="${build#*:}/drift" ./scripts/bundle-macos.sh
            ditto -c -k --keepParent dist/drift.app "out/drift-$VERSION-macos-$name.zip"
          done
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          mkdir -p "pkg/drift-$VERSION-linux-x86_64" out
          cp target/release/drift README.md LICENSE "pkg/drift-$VERSION-linux-x86_64/"
          tar -C pkg -czf "out/drift-$VERSION-linux-x86_64.tar.gz" "drift-$VERSION-linux-x86_64"
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cargo build --release --locked
          mkdir -p "pkg/drift-$VERSION-windows-x86_64" out
          cp target/release/drift.exe README.md LICENSE "pkg/drift-$VERSION-windows-x86_64/"
          cd pkg && 7z a "../out/drift-$VERSION-windows-x86_64.zip" "drift-$VERSION-windows-x86_64" > /dev/null

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drift-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Release notes
        run: |
          # What changed since the version before this one.
          previous=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=v:refname | grep -B1 -x "$TAG" | grep -vx "$TAG" || true)
          {
            echo "### Changes"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --format='- %s' "$previous..$TAG"
            else
              git log --no-merges --format='- %s' "$TAG"
            fi
            echo
            echo "### Install"
            echo
            echo "- **macOS**: unzip \`drift-${TAG#v}-macos-universal.zip\` (Apple silicon and Intel; or the smaller \`-macos-arm64\` for Apple silicon, \`-macos-x86_64\` for Intel) and drag \`drift.app\` to Applications. It isn't notarized yet: open it the first time with right-click → Open, or run \`xattr -dr com.apple.quarantine /Applications/drift.app\`."
            echo "- **Linux** (x86_64): unpack the \`.tar.gz\` and run \`drift\`; it needs GTK 3, WebKitGTK 4.1 and D-Bus."
            echo "- **Windows** (x86_64): unzip and run \`drift.exe\`."
          } > notes.md
      - name: Checksums
        # drift checks the file it updates itself from against these.
        run: cd out && sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --verify-tag --title "drift ${TAG#v}" --notes-file notes.md
          fi
